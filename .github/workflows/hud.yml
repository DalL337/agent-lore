# Type-checks, tests, and builds the HUD, then drives the built page in
# headless Chrome (preinstalled on ubuntu-latest).
name: hud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Drive the built page in headless Chrome
        run: node hud/test/e2e/ui.e2e.mjs
      - name: Run lore hud as a user would (background, reuse, status, stop)
        run: node hud/test/e2e/cli.e2e.mjs
