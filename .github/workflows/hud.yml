# Type-checks, tests, and builds the HUD, then drives the built page in
# headless Chrome (preinstalled on ubuntu-latest).
name: hud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hud:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to commit SHAs rather than mutable tags before release.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Drive the built page in headless Chrome
        run: node hud/test/e2e/ui.e2e.mjs
      - name: Run lore hud as a user would (background, reuse, status, stop)
        run: node hud/test/e2e/cli.e2e.mjs
