# Stages @dall337/lore on npm when a GitHub Release is published. Nothing
# goes live until the owner approves it.
#
# - No stored token: npm trusted publishing (OIDC) authorizes this workflow.
#   Setup on npmjs.com: the package's Settings → Trusted Publisher → GitHub
#   Actions, user DalL337, repository agent-lore, workflow publish.yml, with
#   "Allow npm publish" and "Allow npm dist-tag" left unchecked, so this
#   workflow can only stage.
# - Approval: npmjs.com → the package → Staged Packages → review → Approve
#   (2FA), or `npm stage approve <stage-id>` from a terminal (2FA). Only then
#   is the version published.
#
# Staging needs npm 11.15+ and Node 22.14+.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin to commit SHAs rather than mutable tags before release.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with staged publishing
        run: npm install -g npm@11.21.0 && npm --version

      - name: The release tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prepack builds the HUD into the package. This stages it; the owner's
      # approval on npmjs.com (with 2FA) publishes it.
      - run: npm stage publish
